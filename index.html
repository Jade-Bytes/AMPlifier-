<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080c1b" />
    <meta name="description" content="AMPlifier — track grades, forecast your general average, and organize schoolwork." />
    <!-- Installable app: manifest + icons. On iPhone, Share → Add to Home Screen uses the apple-* tags. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AMPlifier" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var prefs = JSON.parse(localStorage.getItem('amplifier-preferences') || '{}');
        var theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (error) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>AMPlifier — Your academics, amplified.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
